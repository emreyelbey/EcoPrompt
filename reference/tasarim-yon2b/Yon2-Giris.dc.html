<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Giriş — modern</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter Tight',system-ui,sans-serif}
a{color:#D4D4D8}a:hover{color:#FFFFFF}
input::placeholder{color:#71717A}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0A0A0B;color:#FAFAFA;display:flex;flex-direction:column;padding:28px 28px 32px">
  <div style="display:flex;align-items:center;justify-content:space-between">
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:28px;height:28px;border-radius:8px;background:#FAFAFA;display:flex;align-items:center;justify-content:center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0A0A0B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5-10-5z"></path><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"></path></svg>
      </div>
      <span style="font-size:14px;font-weight:600;letter-spacing:-0.01em">Eğitim Asistanı</span>
    </div>
    <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#A1A1AA;letter-spacing:0.08em">2204-A</span>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px">
    <h1 style="margin:0;font-size:52px;line-height:52px;font-weight:600;letter-spacing:-0.04em">Sor.<br>Öğren.<br><span style="font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;letter-spacing:-0.01em;color:{{accent}}">Derinleş.</span></h1>
    <p style="margin:0;font-size:16px;line-height:24px;color:#A1A1AA;max-width:290px">Ders ve araştırma için kişisel sohbet asistanın.</p>
  </div>

  <form style="display:flex;flex-direction:column;gap:12px">
    <label for="kod2" style="font-size:12px;font-weight:500;color:#A1A1AA;letter-spacing:0.08em;text-transform:uppercase">Katılımcı kodu</label>
    <input id="kod2" type="text" placeholder="K001" style="height:56px;box-sizing:border-box;border:1px solid #2A2A2F;border-radius:16px;padding:0 18px;font-size:20px;font-family:'JetBrains Mono',monospace;letter-spacing:0.12em;color:#FAFAFA;background:#141416;outline:none">
    <button type="button" style="height:56px;border:0;border-radius:999px;background:#FAFAFA;color:#0A0A0B;font-size:16px;font-weight:600;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer">
      Giriş Yap
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A0A0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
    </button>
    <p style="margin:4px 0 0;font-size:13px;line-height:20px;color:#A1A1AA;text-align:center">Kodunu öğretmeninden aldığın karttan gir.</p>
  </form>

  <div style="margin-top:20px;padding-top:16px;border-top:1px solid #1F1F23;display:flex;align-items:center;justify-content:space-between">
    <span style="font-size:12px;color:#8A8A93">TÜBİTAK 2204-A Lise Araştırma Projesi</span>
    <a href="#" style="font-size:13px;font-weight:500;padding:12px 0 12px 12px;text-decoration:none">Yönetici</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#A5B4FC","options":["#A5B4FC","#FAFAFA","#F5C77E","#93C5FD"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#A5B4FC' };
  }
}
</script>
</body>
</html>
